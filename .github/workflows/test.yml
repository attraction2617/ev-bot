name: Test HKJC Connection

on:
  workflow_dispatch: # 允許在 GitHub 網頁手動按按鈕執行

jobs:
  test-hkjc:
    runs-on: ubuntu-latest
    steps:
      - name: 下載倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          pip install requests

      - name: 執行測試腳本
        run: |
          python test_api.py
